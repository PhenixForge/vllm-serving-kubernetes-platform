# Nginx Ingress load-balancer pour vLLM
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ingress
  namespace: vllm
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Configuration critique pour le streaming vLLM / SSE
    nginx.ingress.kubernetes.io/proxy-buffering: "off" # détail que beaucoup de monde oublie et qui casse le streaming en silence
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: vllm.local # Remplacez par votre FQDN
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vllm-service
            port:
              number: 8000