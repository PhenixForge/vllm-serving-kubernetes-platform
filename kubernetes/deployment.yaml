# Déploiement vLLM sur kind (local). Modèle et flags vLLM déjà figés dans l'image
# custom (voir container/Containerfile) ; buildée puis chargée dans kind via
# scripts/podman.sh + `kind load docker-image vllm-serving:latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm
  labels:
    app: vllm-server
spec:
  replicas: 1
  strategy:
    # RollingUpdate (par défaut) crée le nouveau pod avant de tuer l'ancien ;
    # sur ce nœud à un seul GPU, le nouveau reste bloqué en Pending
    # ("Insufficient nvidia.com/gpu") tant que l'ancien tient la seule unité
    # disponible. Même leçon que Prometheus (semaine 4) avec son PVC RWO,
    # cette fois sur une contrainte GPU plutôt que stockage.
    type: Recreate
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      # Isolation des charges GPU. Sur ce cluster kind mono-nœud, la
      # nodeAffinity est vérifiable (le nœud est labellisé nvidia.com/gpu.present=true
      # ci-dessous) mais n'isole rien puisqu'il n'y a qu'un seul nœud. La
      # toleration, elle, ne fait rien tant qu'aucun taint ne matche — posée
      # par anticipation de la migration EKS (semaine 6), où les node groups
      # GPU (g5.xlarge, via Karpenter) porteront réellement ce taint pour
      # empêcher des pods non-GPU de s'y faire scheduler.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values: ["true"]
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      # fsGroup 1000 : aligne l'ownership du PVC (créé par un pod tournant en
      # root avant la semaine 5) avec le nouvel utilisateur non-root du conteneur.
      securityContext:
        fsGroup: 1000
      # preStop (5s, cf. container) + budget pour qu'une requête en cours
      # (jusqu'à 200 tokens, généralement <2s à faible charge d'après le
      # benchmark semaine 4) finisse avant le SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
      - name: vllm
        image: localhost/vllm-mistral-7b-v01:latest
        imagePullPolicy: Never # image chargée localement dans kind, jamais pull depuis un registre
        # Montages /dev/nvidia*+libs à la main : le device plugin annonce
        # nvidia.com/gpu mais utilise la stratégie "envvar" (NVIDIA_VISIBLE_DEVICES),
        # qui suppose nvidia-container-runtime pour l'injection réelle des devices/libs.
        # Ce cluster n'en a pas (setup manuel, voir docs/week-03-notes.md) : on
        # reproduit l'injection à la main tant que ce n'est pas en place.
        #
        # PAS de `privileged: true` (semaine 4) : en mode privileged, runc
        # mirrore tous les devices du nœud kind, y compris /dev/cpu/*/cpuid —
        # cassé sur ce nœud (mode `c---------`, owner nobody:nogroup) — ce qui
        # fait planter la création du conteneur à chaque recréation du pod
        # ("error creating device nodes"). Découvert sur dcgm-exporter d'abord
        # (cf. docs/week-04-notes.md), puis reproduit ici au premier
        # redémarrage du pod vLLM depuis le passage en stratégie Recreate.
        #
        # Semaine 5 (moindre privilège) : testé sans SYS_ADMIN — CUDA/NVML
        # s'en passent très bien du moment que les devices /dev/nvidia* sont
        # montés explicitement (ce qui est déjà le cas ci-dessous). Capacité
        # retirée, driver le prouve dans docs/week-05-notes.md.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: vllm-config
        env:
        - name: LD_LIBRARY_PATH
          value: /opt/nvidia-libs
        # runAsUser 1000 n'a pas d'entrée dans /etc/passwd de cette image
        # (construite pour tourner en root). Sans ça, `getpass.getuser()`
        # (utilisé par torch._inductor pour son cache dir) plante en
        # `KeyError: getpwuid(): uid not found` — Python essaie d'abord ces
        # variables d'environnement avant pwd.getpwuid(), donc les poser
        # suffit à éviter tout le problème sans toucher à l'image.
        - name: USER
          value: vllm
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "12Gi"
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 20
          failureThreshold: 3
        # /health répond indépendamment de la file de requêtes (vérifié :
        # reste rapide même sous la charge du balayage de benchmark semaine 4,
        # qui poussait la latence p95 des vraies requêtes à 55s) — les probes
        # ci-dessus n'ont donc pas besoin d'être desserrées pour ça.
        lifecycle:
          preStop:
            # Laisse le temps au kube-proxy/Ingress de retirer ce pod de la
            # rotation avant que vLLM ne reçoive le SIGTERM, pour ne pas
            # couper des requêtes en cours d'admission juste avant l'arrêt.
            exec:
              command: ["/usr/bin/sleep", "5"]
        volumeMounts:
        # readOnlyRootFilesystem: true (semaine 5) — /tmp et /dev/shm ont
        # besoin de leur propre volume inscriptible. /dev/shm en particulier :
        # PyTorch/vLLM s'en servent pour l'IPC entre le process API et
        # l'engine core (architecture V1), la taille par défaut du rootfs
        # (souvent 64Mi) ne suffit pas toujours pour des tenseurs partagés.
        - mountPath: /tmp
          name: tmp
        - mountPath: /dev/shm
          name: shm
        - mountPath: /cache/huggingface
          name: model-cache
        - mountPath: /opt/nvidia-libs
          name: nvidia-libs
          readOnly: true
        - mountPath: /dev/nvidia0
          name: dev-nvidia
        - mountPath: /dev/nvidiactl
          name: dev-nvidiactl
        - mountPath: /dev/nvidia-uvm
          name: dev-nvidia-uvm
        - mountPath: /dev/nvidia-uvm-tools
          name: dev-nvidia-uvm-tools
      volumes:
      - name: tmp
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: model-cache
        persistentVolumeClaim:
          claimName: vllm-model-cache
      - name: nvidia-libs
        hostPath:
          path: /opt/nvidia-libs
      - name: dev-nvidia
        hostPath:
          path: /dev/nvidia0
      - name: dev-nvidiactl
        hostPath:
          path: /dev/nvidiactl
      - name: dev-nvidia-uvm
        hostPath:
          path: /dev/nvidia-uvm
      - name: dev-nvidia-uvm-tools
        hostPath:
          path: /dev/nvidia-uvm-tools
