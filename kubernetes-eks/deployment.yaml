# Déploiement vLLM sur EKS — variante de kubernetes/deployment.yaml (kind local).
# Différences, toutes liées au passthrough GPU :
#   - Pas de mounts hostPath sur /dev/nvidia*/opt/nvidia-libs, pas de
#     LD_LIBRARY_PATH : sur l'AMI accélérée (Karpenter, alias al2023@latest), le
#     nvidia-container-runtime + le device plugin (kubernetes-eks/nvidia-device-plugin.yaml)
#     injectent les devices/libs automatiquement — c'est précisément ce que
#     le passthrough manuel de kind reproduisait à la main (cf. docs/week-03-notes.md).
#   - `image` pointe vers un registre réel (ECR) — plus de `imagePullPolicy: Never`
#     ni de `kind load docker-image`. À construire et pousser AVANT le premier
#     déploiement (pas fait par ce Terraform/ces manifestes, cf. kubernetes-eks/README.md) :
#       docker build -t <ECR_REPO_URI>:latest -f container/Containerfile .
#       docker push <ECR_REPO_URI>:latest
#   - Le reste (SecurityContext durci semaine 5, nodeAffinity/toleration GPU
#     semaine 4, Recreate, probes, lifecycle, /tmp+/dev/shm) est IDENTIQUE et
#     repris tel quel — rien de tout ça n'était spécifique à kind.
#
# Semaine 7 — deux changements par rapport au premier jet de la semaine 6,
# dictés par le scale-out KEDA (plusieurs replicas, un GPU par nœud) :
#   - Cache modèle en emptyDir au lieu du PVC `vllm-model-cache` : un volume EBS
#     (gp3) est ReadWriteOnce ET lié à une AZ — un 2e pod sur un 2e nœud GPU ne
#     pourrait pas le monter (Multi-Attach / mauvaise AZ) et resterait bloqué.
#     Conséquence assumée : chaque pod télécharge les poids (~4 Go) depuis
#     Hugging Face à froid. C'est LA ligne de base du cold start à mesurer ; les
#     optimisations (EFS RWX, poids dans l'AMI via Packer) se comparent à elle.
#   - startupProbe : sur un nœud neuf le démarrage = pull d'image + téléchargement
#     des poids + chargement en VRAM ; sans startupProbe, la liveness
#     (120 s + 3x20 s) tuerait le pod avant la fin. Voir docs/week7 guide.md.
#
# PAS ENCORE VÉRIFIÉ EN PRATIQUE (pas de cluster EKS réel au moment de
# l'écriture) — en particulier le comportement sans privileged/SYS_ADMIN sur
# un vrai nvidia-container-runtime reste à confirmer au premier déploiement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm
  labels:
    app: vllm-server
spec:
  replicas: 1
  strategy:
    # Même leçon qu'en semaine 4 (kind) : un seul GPU par nœud g5.xlarge,
    # RollingUpdate laisserait le nouveau pod en Pending le temps que l'ancien
    # libère l'unique unité nvidia.com/gpu.
    type: Recreate
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      # Ici la nodeAffinity + toleration isolent RÉELLEMENT les charges GPU
      # (plusieurs nœuds sur EKS, contrairement au cluster kind mono-nœud où
      # c'était surtout symbolique, cf. docs/week-04-notes.md) : le taint
      # nvidia.com/gpu:NoSchedule est posé pour de vrai par Karpenter sur le
      # NodePool "gpu" (terraform/karpenter.tf), le label nvidia.com/gpu.present=true
      # aussi (même convention que sur kind, aucun changement ici).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values: ["true"]
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
      - name: vllm
        # Remplacer par l'URI ECR réel avant le premier déploiement.
        image: <ECR_REPO_URI>:latest
        imagePullPolicy: IfNotPresent
        # Arguments vLLM propres au A10G 24 Go : REMPLACENT le CMD de l'image
        # (ENTRYPOINT = `vllm serve`, vérifié dans le Dockerfile v0.20.2), qui est
        # figé pour la RTX 4060 8 Go partagée (--max-model-len 880,
        # --gpu-memory-utilization 0.6). Pas de rebuild d'image nécessaire.
        # Justification et variante FP16 : docs/vllm-gpu-aws.md.
        args:
        - TheBloke/Mistral-7B-Instruct-v0.1-AWQ
        - --quantization=awq_marlin
        - --dtype=half # AWQ = fp16 ; le config.json du modèle annonce bfloat16
        - --max-model-len=8192
        - --gpu-memory-utilization=0.90
        - --trust-request-chat-template
        # Repris tel quel de kind (semaine 5) : runAsNonRoot fonctionnait déjà
        # sans capacité particulière une fois le passthrough manuel retiré —
        # devrait donc marcher aussi bien, sinon mieux, avec un vrai
        # nvidia-container-runtime qui gère l'injection des devices lui-même.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: vllm-config
        env:
        # USER/HOME toujours nécessaires (semaine 5) : indépendant du
        # passthrough GPU, c'est `torch._inductor` qui plante sans entrée
        # /etc/passwd pour un UID arbitraire — même image, même bug.
        - name: USER
          value: vllm
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "12Gi"
            nvidia.com/gpu: "1"
        # Laisse jusqu'à 15 min (90 x 10 s) au démarrage à froid ; liveness et
        # readiness ne s'appliquent qu'une fois celle-ci réussie.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/usr/bin/sleep", "5"]
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /dev/shm
          name: shm
        - mountPath: /cache/huggingface
          name: model-cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: model-cache
        emptyDir:
          sizeLimit: 20Gi # poids AWQ ~4 Go + marge ; le disque racine du nœud fait 100 Gi (karpenter.tf)
