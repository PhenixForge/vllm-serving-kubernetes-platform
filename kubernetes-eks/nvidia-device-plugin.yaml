# Manifeste standard, NON patché — contrairement à kubernetes/nvidia-device-plugin-patched.yml
# (kind, sans nvidia-container-runtime, avait besoin de mounts hostPath manuels
# + privileged pour que le plugin accède lui-même à /dev/nvidia*). Sur EKS,
# l'AMI accélérée sélectionnée par Karpenter (amiFamily: AL2, cf.
# terraform/karpenter.tf) embarque déjà le driver NVIDIA + nvidia-container-runtime
# configuré : le plugin peut s'appuyer dessus normalement, comme prévu par
# l'outil en amont. Version vérifiée contre les releases GitHub le 2026-09-17
# (v0.20.0, la plus récente) plutôt que reprise de mémoire.
#
# Dérivé de https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.20.0/deployments/static/nvidia-device-plugin.yml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: "system-node-critical"
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.20.0
        name: nvidia-device-plugin-ctr
        env:
          - name: FAIL_ON_INIT_ERROR
            value: "false"
        securityContext:
          # privileged requis par ce plugin de base même sur un runtime GPU-aware
          # (accès direct à /dev/nvidia* pour interroger NVML) — contrairement
          # à vLLM/DCGM, qui n'en avaient besoin sur kind qu'à cause de l'absence
          # de nvidia-container-runtime (cf. docs/week-04-notes.md, semaine 5).
          # C'est le comportement par défaut du manifeste amont, pas un
          # contournement propre à ce cluster.
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
